services:
  web:
    build: .
    ports:
      - "8000:8000"
    environment:
      PORT: "8000"
      DB_DRIVER: mysql
      MYSQL_HOST: mysql
      MYSQL_PORT: "3306"
      MYSQL_DATABASE: ctfd
      MYSQL_USER: ctfd
      MYSQL_PASSWORD: ctfd
      SECRET_KEY: ${SECRET_KEY:-change-this-to-a-long-random-string}
      UPLOAD_DIR: /app/data/uploads
      DATA_DIR: /app/data
      TASKS_DIR: /app/data/tasks
      PUBLIC_HOST: ${PUBLIC_HOST:-127.0.0.1}
      GIN_MODE: release
    depends_on:
      mysql:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - uploads:/app/data
      - /var/run/docker.sock:/var/run/docker.sock
    stop_grace_period: 2m
    restart: unless-stopped

  mysql:
    image: mariadb:11
    environment:
      MARIADB_DATABASE: ctfd
      MARIADB_USER: ctfd
      MARIADB_PASSWORD: ctfd
      MARIADB_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpass}
      MYSQL_DATABASE: ctfd
      MYSQL_USER: ctfd
      MYSQL_PASSWORD: ctfd
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpass}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --skip-name-resolve
    volumes:
      - mariadb_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 40s
    restart: unless-stopped

volumes:
  mariadb_data:
  uploads:
