services:
  web:
    build: .
    ports:
      - "8000:8000"
    environment:
      PORT: "8000"
      DB_DRIVER: postgres
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB: ctfd
      POSTGRES_USER: ctfd
      POSTGRES_PASSWORD: ctfd
      REDIS_ADDR: redis:6379
      SECRET_KEY: ${SECRET_KEY:-change-this-to-a-long-random-string}
      UPLOAD_DIR: /app/data/uploads
      DATA_DIR: /app/data
      TASKS_DIR: /app/data/tasks
      PUBLIC_HOST: ${PUBLIC_HOST:-127.0.0.1}
      GIN_MODE: release
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - uploads:/app/data
      - /var/run/docker.sock:/var/run/docker.sock
    stop_grace_period: 2m
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ctfd
      POSTGRES_USER: ctfd
      POSTGRES_PASSWORD: ctfd
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ctfd -d ctfd"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  uploads:
