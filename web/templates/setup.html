{{template "head" .}}
<nav class="navbar navbar-dark ctfd-navbar"><div class="container"><span class="navbar-brand" data-i18n="Setup">Setup</span></div></nav>
{{template "flashes" .}}
<main class="container py-5" style="max-width: 640px;">
  <h2 class="mb-4" data-i18n="Setup your CTF">Setup your CTF</h2>
  <form method="post">
    <input type="hidden" name="nonce" value="{{.CSRF}}">
    <h5 data-i18n="General">General</h5>
    <div class="mb-3">
      <label class="form-label" data-i18n="Event Name">Event Name</label>
      <input class="form-control" name="ctf_name" required placeholder="CTFd">
    </div>
    <div class="mb-3">
      <label class="form-label" data-i18n="Event Description">Event Description</label>
      <textarea class="form-control" name="ctf_description" rows="3"></textarea>
    </div>
    <h5 class="mt-4" data-i18n="Mode">Mode</h5>
    <div class="mb-3">
      <label class="form-label" data-i18n="Game type">Game type</label>
      <select class="form-select" name="game_mode">
        <option value="jeopardy" data-i18n="Jeopardy">Jeopardy</option>
        <option value="attack_defense" data-i18n="Attack-Defense">Attack-Defense</option>
        <option value="mixed" data-i18n="Mixed (Jeopardy + Attack-Defense)">Mixed (Jeopardy + Attack-Defense)</option>
      </select>
    </div>
    <div class="mb-3">
      <label class="form-label" data-i18n="Accounts">Accounts</label>
      <select class="form-select" name="user_mode">
        <option value="users" data-i18n="Users">Users</option>
        <option value="teams" data-i18n="Teams (required for Attack-Defense)">Teams (required for Attack-Defense)</option>
      </select>
    </div>
    <div class="mb-3">
      <label class="form-label" data-i18n="Timezone">Timezone</label>
      {{template "tzselect" "UTC"}}
      <div class="form-text" data-i18n="config.timezoneHint">Everyone sees event times in this timezone.</div>
    </div>
    <div class="row">
      <div class="col mb-3">
        <label class="form-label" data-i18n="Start (optional)">Start (optional)</label>
        <input class="form-control" type="datetime-local" name="start">
      </div>
      <div class="col mb-3">
        <label class="form-label" data-i18n="End (optional)">End (optional)</label>
        <input class="form-control" type="datetime-local" name="end">
      </div>
    </div>
    <h5 class="mt-4" data-i18n="Administration">Administration</h5>
    <div class="mb-3">
      <label class="form-label" data-i18n="Admin Username">Admin Username</label>
      <input class="form-control" name="name" required>
    </div>
    <div class="mb-3">
      <label class="form-label" data-i18n="Admin Email">Admin Email</label>
      <input class="form-control" type="email" name="email" required>
    </div>
    <div class="mb-3">
      <label class="form-label" data-i18n="Admin Password">Admin Password</label>
      <input class="form-control" type="password" name="password" required minlength="6">
    </div>
    <button class="btn btn-primary w-100" type="submit" data-i18n="Finish">Finish</button>
  </form>
</main>
{{template "footer" .}}
