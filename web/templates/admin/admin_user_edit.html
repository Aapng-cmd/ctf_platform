{{template "head" .}}
{{template "navbar" .}}
<div class="admin-wrap">
{{template "adminnav" .}}
<main class="admin-main">
  {{template "flashes" .}}
  <h2 data-i18n="Edit User">Edit User</h2>
  <form method="post">
    <input type="hidden" name="nonce" value="{{.CSRF}}">
    <div class="row">
      <div class="col-md-6 mb-3"><label class="form-label" data-i18n="Name">Name</label><input class="form-control" name="name" value="{{.Profile.Name}}"></div>
      <div class="col-md-6 mb-3"><label class="form-label" data-i18n="Email">Email</label><input class="form-control" name="email" value="{{.Profile.Email}}"></div>
    </div>
    <div class="mb-3">
      <label class="form-label" data-i18n="Type">Type</label>
      <select class="form-select" name="type">
        <option value="user" {{if eq .Profile.Type "user"}}selected{{end}} data-i18n="user">user</option>
        <option value="admin" {{if eq .Profile.Type "admin"}}selected{{end}} data-i18n="admin">admin</option>
      </select>
    </div>
    <div class="mb-3" hidden><label class="form-label" data-i18n="Website">Website</label><input class="form-control" name="website" value="{{.Profile.Website}}"></div>
    <div class="mb-3" hidden><label class="form-label" data-i18n="Affiliation">Affiliation</label><input class="form-control" name="affiliation" value="{{.Profile.Affiliation}}"></div>
    <div class="mb-3" hidden>
      <label class="form-label" data-i18n="Country">Country</label>
      <select class="form-select" name="country">
        <option value=""></option>
        {{range .Countries}}<option value="{{.Code}}" {{if eq $.Profile.Country .Code}}selected{{end}}>{{.Name}}</option>{{end}}
      </select>
    </div>
    <div class="mb-3"><label class="form-label" data-i18n="New Password">New Password</label><input class="form-control" type="password" name="password"></div>
    <div class="form-check"><input class="form-check-input" type="checkbox" name="hidden" {{if .Profile.Hidden}}checked{{end}}><label class="form-check-label" data-i18n="Hidden">Hidden</label></div>
    <div class="form-check"><input class="form-check-input" type="checkbox" name="banned" {{if .Profile.Banned}}checked{{end}}><label class="form-check-label" data-i18n="Banned">Banned</label></div>
    <div class="form-check mb-3"><input class="form-check-input" type="checkbox" name="verified" {{if .Profile.Verified}}checked{{end}}><label class="form-check-label" data-i18n="Verified">Verified</label></div>
    <button class="btn btn-primary" type="submit" data-i18n="Save">Save</button>
  </form>
  <h5 class="mt-4" data-i18n="Solves">Solves</h5>
  <table class="table table-sm">
    {{range .Solves}}<tr><td>{{.Challenge.Name}}</td><td>{{formatDate .Date}}</td></tr>{{end}}
  </table>
  <form class="mt-3" method="post" action="/admin/users/{{.Profile.ID}}/delete" data-confirm="confirm.deleteUser">
    <input type="hidden" name="nonce" value="{{.CSRF}}">
    <button class="btn btn-danger" type="submit" data-i18n="Delete User">Delete User</button>
  </form>
</main>
</div>
{{template "footer" .}}
