{{template "head" .}}
{{template "navbar" .}}
<div class="admin-wrap">
{{template "adminnav" .}}
<main class="admin-main">
  {{template "flashes" .}}
  <h2 data-i18n="Scoreboard">Scoreboard</h2>
  <div class="table-responsive">
  <table class="table">
    <thead><tr><th data-i18n="Place">Place</th><th data-i18n="Name">Name</th><th data-i18n="Score">Score</th><th data-i18n="Solves">Solves</th></tr></thead>
    <tbody>
      {{range .Standings}}
      <tr><td>{{.Place}}</td><td>{{.Name}}</td><td>{{.Score}}</td><td>{{.Solves}}</td></tr>
      {{end}}
    </tbody>
  </table>
  </div>
</main>
</div>
{{template "footer" .}}
